services:
  postgres:
    image: postgres:16-alpine
    container_name: flowboard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowboard
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: flowboard-api
    ports: ["8000:8000", "9229:9229"]
    environment:
      PORT: 8000
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowboard
      JWT_SECRET: dev-only-secret-change-me
      WEB_URL: http://localhost:3000
      AUTH_REDIRECT_URL: http://localhost:3000/dashboard
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./packages/shared:/app/packages/shared
      - ./packages/ui:/app/packages/ui
      - ./apps/server:/app/apps/server
      - /app/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
      - /app/apps/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/apps/server
    command: sh -c "pnpm --filter @flow/shared build && pnpm dev"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: flowboard-web
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      # Turbopack polling for reliable file watching in Docker
      WATCHPACK_POLLING: "true"
    volumes:
      - ./packages/shared:/app/packages/shared
      - ./packages/ui:/app/packages/ui
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - server
    working_dir: /app/apps/web
    command: sh -c "pnpm --filter @flow/shared build && pnpm dev"

volumes:
  pgdata:
